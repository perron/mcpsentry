[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcpsentry"
version = "0.1.1"
description = "Lint MCP tool manifests for prompt-injection phrasing, missing hints, and incomplete schemas."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Karl Perron"}]
keywords = ["ai", "mcp", "cli", "security", "linter"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Environment :: Console",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/perron/mcpsentry"
Repository = "https://github.com/perron/mcpsentry"
Issues = "https://github.com/perron/mcpsentry/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mcpsentry = "mcpsentry.cli:main"

[tool.setuptools.packages.find]
include = ["mcpsentry*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
